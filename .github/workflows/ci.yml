name: actl CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile sources
        run: python -m py_compile $(find src tests -name '*.py' -print)
      - name: Run dependency-free test suite
        env:
          PYTHONPATH: src
        run: python tests/run_tests.py

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        shell: pwsh
        run: |
          $files = Get-ChildItem src,tests -Recurse -Filter *.py
          python -m py_compile $files.FullName
      - name: Install package builder
        run: python -m pip install pyinstaller
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build Windows installer
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "juactl-build.log"
          & .\scripts\build-installer.ps1 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed" }
          if (Select-String -Path $log -Pattern "rapidfuzz|discover_hook_directories") {
            throw "PyInstaller used a polluted environment or emitted the known hook warning"
          }
      - name: Verify executable
        shell: pwsh
        run: |
          foreach ($name in @("JuActlBoard.exe", "JuActl.exe", "JuActl-Setup.exe")) {
            if (-not (Test-Path "dist/$name")) { throw "$name was not produced" }
          }
          $doctor = & .\dist\JuActl.exe doctor --json | ConvertFrom-Json
          if ($null -eq $doctor.ok) { throw "packaged CLI doctor contract failed" }
      - name: Install and uninstall smoke
        shell: pwsh
        run: |
          $installDir = Join-Path $env:TEMP "juactl-install-smoke"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          & .\dist\JuActl-Setup.exe /VERYSILENT /NORESTART /SUPPRESSMSGBOXES "/DIR=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "installer smoke failed" }
          foreach ($name in @("JuActlBoard.exe", "JuActl.exe", "SHA256SUMS.txt")) {
            if (-not (Test-Path (Join-Path $installDir $name))) { throw "installed file missing: $name" }
          }
          $installedDoctor = & (Join-Path $installDir "JuActl.exe") doctor --json | ConvertFrom-Json
          if ($null -eq $installedDoctor.ok) { throw "installed CLI doctor contract failed" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          & $uninstaller /VERYSILENT /NORESTART
          if (Test-Path $installDir) { throw "uninstaller smoke did not remove install directory" }
      - uses: actions/upload-artifact@v4
        with:
          name: JuActlBoard-windows
          path: |
            dist/JuActlBoard.exe
            dist/JuActl.exe
            dist/JuActl-Setup.exe
            dist/SHA256SUMS.txt
