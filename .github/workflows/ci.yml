name: actl CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile sources
        run: python -m py_compile $(find src tests -name '*.py' -print)
      - name: Run dependency-free test suite
        env:
          PYTHONPATH: src
        run: python tests/run_tests.py

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        shell: pwsh
        run: |
          $files = Get-ChildItem src,tests -Recurse -Filter *.py
          python -m py_compile $files.FullName
      - name: Install package builder
        run: python -m pip install pyinstaller
      - name: Build Windows board
        run: python -m PyInstaller --clean --noconfirm --onefile --noconsole --name JuActlBoard --paths src src/juactl-board.py
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/JuActlBoard.exe)) { throw "JuActlBoard.exe was not produced" }
          $hash = Get-FileHash dist/JuActlBoard.exe -Algorithm SHA256
          "$($hash.Hash)  JuActlBoard.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: JuActlBoard-windows
          path: |
            dist/JuActlBoard.exe
            dist/SHA256SUMS.txt
