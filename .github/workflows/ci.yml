name: actl CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile sources
        run: python -m py_compile $(find src tests -name '*.py' -print)
      - name: Run dependency-free test suite
        env:
          PYTHONPATH: src
        run: python tests/run_tests.py

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        shell: pwsh
        run: |
          $files = Get-ChildItem src,tests -Recurse -Filter *.py
          python -m py_compile $files.FullName
      - name: Install package builder
        run: python -m pip install pyinstaller
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build-installer.ps1
      - name: Verify executable
        shell: pwsh
        run: |
          foreach ($name in @("JuActlBoard.exe", "JuActl.exe", "JuActl-Setup.exe")) {
            if (-not (Test-Path "dist/$name")) { throw "$name was not produced" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: JuActlBoard-windows
          path: |
            dist/JuActlBoard.exe
            dist/JuActl.exe
            dist/JuActl-Setup.exe
            dist/SHA256SUMS.txt
